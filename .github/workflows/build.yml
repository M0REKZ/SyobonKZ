name: Build

on:
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
        
      - name: Prepare Linux
        run: |
          sudo apt-get update -y
          sudo apt install build-essential git
          sudo apt-get install libsdl1.2-compat-dev cmake

      - name: Build SyobonKZ
        run: |
          mkdir -p build
          cd build
          cmake ..
          make

      - name: Prepare artifact
        run: |
          cd build
          mkdir SyobonKZ-Linux
          mv ./SyobonAction ./SyobonKZ-Linux/
          mv ./res ./SyobonKZ-Linux/
          mv ./BGM ./SyobonKZ-Linux/
          mv ./SE ./SyobonKZ-Linux/
          mv ./lib ./SyobonKZ-Linux/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SyobonKZ-ubuntu-22.04
          path: build/SyobonKZ-Linux


  build-windows:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
        
      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: mingw64
          update: true
          install: >
            mingw-x86_64-toolchain
            mingw-x86_64-cmake
            mingw-x86_64-make
            mingw-x86_64-sdl3
            mingw-x86_64-sdl3_image
            mingw-x86_64-sdl3_mixer
            mingw-x86_64-sdl3_ttf

      - name: Build SyobonKZ
        shell: msys2 {0}
        run: |
          mkdir -p build
          cd build
          cmake -G "MinGW Makefiles" -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ -DSYOBONKZ_USE_SDL3=ON -DSYOBONKZ_BUILD_SDL1_EXTENSIONS=OFF ..
          mingw32-make

      - name: Prepare artifact
        run: |
          cd build
          mkdir SyobonKZ-Windows
          mv ./SyobonAction ./SyobonKZ-Windows/
          mv ./res ./SyobonKZ-Windows/
          mv ./BGM ./SyobonKZ-Windows/
          mv ./SE ./SyobonKZ-Windows/
          mv ./lib ./SyobonKZ-Windows/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SyobonKZ-windows-32
          path: build/SyobonKZ-Windows
